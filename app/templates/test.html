{% extends "base.html" %}{% block title %}{{topic}} · LATINA{% endblock %}{% block content %}<div class="card test"><div class="testhead"><span id="num"></span><span id="topic">{{topic}}</span></div><div class="progress"><i id="bar"></i></div><h1 id="question"></h1><div id="options"></div><button id="next" class="btn" disabled>Ответить</button><div id="done"></div></div><script>
const qs={{questions|tojson}};let i=0,ans={};function render(){let q=qs[i];document.getElementById('num').textContent=`Вопрос ${i+1} из ${qs.length}`;document.getElementById('bar').style.width=(i/qs.length*100)+'%';document.getElementById('question').textContent=q.question;document.getElementById('options').innerHTML=['A','B','C','D'].map(k=>`<button class="answer" data-k="${k}"><b>${k}.</b> ${q[k.toLowerCase()]}</button>`).join('');document.getElementById('next').disabled=true;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');ans[q.id]=b.dataset.k;document.getElementById('next').disabled=false})}document.getElementById('next').onclick=async()=>{if(i<qs.length-1){i++;render()}else{let r=await fetch('/api/attempt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:'{{topic|e}}',answers:ans})});let d=await r.json();document.querySelector('.test').innerHTML=`<h1>Тест завершён</h1><div class="score">${d.score} / ${d.total}</div><p>Результат: <b>${d.percent}%</b></p><a class="btn" href="/results">Мои результаты</a> <a class="btn secondary" href="/">К темам</a>`}};render();
</script>{% endblock %}
