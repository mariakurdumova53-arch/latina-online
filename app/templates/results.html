{% extends "base.html" %}{% block content %}<div class="card"><h1>Мои результаты</h1>{% if attempts %}<div class="tablewrap"><table><tr><th>Дата</th><th>Тема</th><th>Результат</th><th>%</th></tr>{% for a in attempts %}<tr><td>{{a.started_at.strftime("%d.%m.%Y %H:%M")}}</td><td>{{a.topic}}</td><td>{{a.score}} / {{a.total}}</td><td><b>{{a.percent}}%</b></td></tr>{% endfor %}</table></div>{% else %}<p>Пока нет попыток.</p>{% endif %}</div>{% endblock %}
